
services:
  nuxt:
    build: .
    ports:
      - '3000:3000'
    environment:
      MONGO_URI: mongodb://localhost:27017/project
    depends_on:
      - mongo
    volumes:
      - .:/app
    command: npm run dev

  mongo:
    image: mongo:6
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
