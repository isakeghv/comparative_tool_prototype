services:
  app:
    image: iseh/compara:latest
    volumes:
      - ./app:/app
    ports:
      - "8183:8183"
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - group3-network

  db:
    image: mongo:latest
    container_name: compara_db
    restart: always
    expose:
      - "27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - group3-network
volumes:
  mongo_data:
    driver: local

networks:
  group3-network:
    driver: bridge
