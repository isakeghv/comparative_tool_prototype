services:
  app:
    image: iseh/compara:latest # based on fork
    #build:
    #  context: ./app
    #container_name: app
    volumes:
      - ./app:/app
    ports:
      - "8183:8183"
    depends_on:
      - db

  db:
    image: mongo:latest
    container_name: compara_db
    restart: always
    # env_file: .env
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=securepassword
      - MONGO_INITDB_DATABASE=compara_db 
      - MONGO_LOGLEVEL=1
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      # - ./db/init.sh:/docker-entrypoint-initdb.d/init.sh
volumes:
  mongo_data:
    driver: local
