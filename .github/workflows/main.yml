name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Setting enviroment variables
        run: |
          echo "MONGO_URI=${{secrets.MONGO_URI}}" >> $GITHUB_ENV
          echo "SECRET_JWT=${{secrets.SECRET_JWT}}" >> $GITHUB_ENV
          echo "TURNSTILE_SECRET_KEY=${{secrets.TURNSTILE_SECRET_KEY}}" >> $GITHUB_ENV
          echo "TURNSTILE_SITE_KEY=${{secrets.TURNSTILE_SITE_KEY}}" >> $GITHUB_ENV

      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push a Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/compara:latest
